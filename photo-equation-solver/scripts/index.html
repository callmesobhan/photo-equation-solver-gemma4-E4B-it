// ---- dispatch -----------------------------------------------------------------------------------------------------------------
function commandsIn(n, acc) {
  if (!n || typeof n !== 'object') return acc;
  if (n.t === 'call') {
    if (n.cmd) acc.push(n.fn);
    n.args.forEach((a) => commandsIn(a, acc));
  } else if (n.t === 'list') n.items.forEach((a) => commandsIn(a, acc));
  else {
    commandsIn(n.a, acc);
    commandsIn(n.b, acc);
  }
  return acc;
}
function nodeOf(st) {
  return st.kind === 'expr' ? [st.node] : st.kind === 'eq' ? [st.lhs, st.rhs] : [];
}
/** Statements that use i (the imaginary unit) or complex commands, with no other kind of command. */
function wantsComplex(sts) {
  if (!sts.length) return false;
  if (!sts.every((s) => s.kind === 'expr' || s.kind === 'eq')) return false;
  let hasI = false;
  let hasCxFn = false;
  for (const st of sts) {
    for (const nd of nodeOf(st)) {
      const cmds = commandsIn(nd, []);
      if (cmds.some((c) => !CX_COMMANDS.includes(c))) return false;
      if (cmds.length) hasCxFn = true;
      const vars = collectVars(nd, new Set());
      if (vars.has('i')) hasI = true;
    }
  }
  return hasI || hasCxFn;
}

function solveComplexEquation(st) {
  const vars = new Set();
  collectVars(st.lhs, vars);
  collectVars(st.rhs, vars);
  vars.delete('i');
  if (vars.size !== 1) throw new MathError('complex equations need exactly one unknown besides i');
  const v = Array.from(vars)[0];
  const f = cpAdd(cpEval(st.lhs, v), cpEval(st.rhs, v), -1);
  const out = newOut();
  const deg = f.length - 1;
  const text = (z) => v + ' = ' + cxLabel(z);
  if (deg === 0) {
    out.answer.push(zeroS(f[0].re) && zeroS(f[0].im) ? 'every complex number is a solution' : 'no solution');
    return out;
  }
  if (deg === 1) {
    const z = cDiv(cNeg(f[0]), f[1]);
    out.answer.push(text(z));
    out.work.push('Type: linear equation with complex numbers: ' + v + ' = \u2212(constant term)/(coefficient of ' + v + ')');
    const chk = cAdd(cMul(f[1], z), f[0]);
    if (Math.abs(numS(chk.re, {})) < 1e-9 && Math.abs(numS(chk.im, {})) < 1e-9) out.check = 'substituting back gives 0';
    return out;
  }
  if (deg === 2) {
    const [c, b, a] = f;
    const disc = cSub(cMul(b, b), cMul(cx(sI(4), S0), cMul(a, c)));
    const sq = cSqrt(disc);
    const two = cMul(cx(sI(2), S0), a);
    const z1 = cDiv(cAdd(cNeg(b), sq), two);
    const z2 = cDiv(cSub(cNeg(b), sq), two);
    out.answer.push(text(z1));
    if (!(zeroS(exS(sSub(z1.re, z2.re))) && zeroS(exS(sSub(z1.im, z2.im))))) out.answer.push(text(z2));
    out.work.push('Type: quadratic equation with complex coefficients');
    out.work.push('Discriminant b\u00b2 \u2212 4ac = ' + cxText(disc));
    const ok = [z1, z2].every((z) => {
      const r = cAdd(cAdd(cMul(a, cMul(z, z)), cMul(b, z)), c);
      return Math.abs(numS(r.re, {})) < 1e-8 && Math.abs(numS(r.im, {})) < 1e-8;
    });
    if (ok) out.check = 'substituting each solution back gives 0';
    return out;
  }
  throw new MathError('complex equations of degree ' + deg + ' are not supported (degree 1 and 2 are)');
}

function tryComplex(sts, force) {
  if (!force && !wantsComplex(sts)) return null;
  if (force && !sts.every((s) => s.kind === 'expr')) return null;
  const readAs = sts.map(showStatement).join(';  ');
  if (sts[0].kind === 'eq') {
    if (sts.length > 1) throw new MathError('one complex equation at a time, please');
    return { readAs, out: solveComplexEquation(sts[0]) };
  }
  const out = newOut();
  const evalOne = (nd) => {
    const top = nd.t === 'call' && nd.cmd ? nd.fn : '';
    if (top === 'polar' || top === 'nthroots' || top === 'croots' || top === 'unityroots') return { cmd: COMMANDS[top](nd) };
    const p = cpEval(nd, null);
    return { z: p[0] };
  };
  if (sts.length === 1) {
    const r = evalOne(sts[0].node);
    if (r.cmd) return { readAs, out: r.cmd };
    out.work.push('Type: complex-number arithmetic (exact; i\u00b2 = \u22121)');
    return { readAs, out: showComplexResult(r.z, out) };
  }
  sts.forEach((st) => {
    const r = evalOne(st.node);
    out.answer.push(showRaw(st.node) + ' = ' + (r.cmd ? r.cmd.answer.join('; ') : cxLabel(r.z)));
  });
  out.work.push('Type: complex-number arithmetic (exact; i\u00b2 = \u22121)');
  return { readAs, out };
}

// ======================================================================
// 9a. Numerical integration (tanh-sinh), used for definite integrals and as a cross-check
// ======================================================================

/** Integral of f over [a, b] (finite) with tanh-sinh quadrature. Returns {value, error, ok}. */
function tanhSinh(f, a, b) {
  const c = (a + b) / 2;
  const h = (b - a) / 2;
  const T = 3.6;
  const pt = (t) => {
    const u = (Math.PI / 2) * Math.sinh(t);
    const d = (h * 2) / (Math.exp(2 * Math.abs(u)) + 1); // distance to the nearest endpoint
    const x = t >= 0 ? b - d : a + d;
    const w = (h * (Math.PI / 2) * Math.cosh(t)) / (Math.cosh(u) * Math.cosh(u));
    return { x, w };
  };
  const term = (t) => {
    const { x, w } = pt(t);
    if (!(x > a && x < b)) return 0;
    const v = f(x);
    return isFinite(v) ? v * w : 0;
  };
  let step = 1;
  let sum = term(0);
  for (let t = step; t <= T; t += step) sum += term(t) + term(-t);
  let est = sum * step;
  let err = Infinity;
  for (let level = 1; level <= 9; level++) {
    step /= 2;
    let add = 0;
    for (let t = step; t <= T; t += 2 * step) add += term(t) + term(-t);
    sum += add;
    const next = sum * step;
    err = Math.abs(next - est);
    est = next;
    if (err <= 1e-13 * Math.max(1, Math.abs(est)) && level >= 3) return { value: est, error: err, ok: true };
  }
  return { value: est, error: err, ok: err <= 1e-8 * Math.max(1, Math.abs(est)) };
}

/** Points inside (a,b) where an abs() argument changes sign (kinks of the integrand). */
function kinkPoints(S, x, a, b) {
  const pts = [];
  const walk = (e) => {
    if (e.k === 'f' && e.fn === 'abs') {
      const g = (t) => numS(e.a[0], { [x]: t });
      const N = 400;
      let prev = g(a);
      for (let i = 1; i <= N; i++) {
        const t = a + ((b - a) * i) / N;
        const cur = g(t);
        if (isFinite(prev) && isFinite(cur) && prev !== 0 && (prev < 0) !== (cur < 0)) {
          let lo = t - (b - a) / N;
          let hi = t;
          for (let k = 0; k < 80; k++) {
            const m = (lo + hi) / 2;
            if ((g(m) < 0) === (g(lo) < 0)) lo = m;
            else hi = m;
          }
          pts.push((lo + hi) / 2);
        }
        prev = cur;
      }
    }
    if (e.k === '+' || e.k === '*' || e.k === 'f') e.a.forEach(walk);
    else if (e.k === '^') {
      walk(e.b);
      walk(e.e);
    }
  };
  walk(S);
  return pts.sort((p, q) => p - q);
}

/** Does |f| blow up like d^-p (p >= 1) when approaching a finite endpoint? */
function endpointDiverges(f, a, b) {
  const probe = (e, dir) => {
    const v = [1e-3, 1e-6, 1e-9].map((d) => Math.abs(f(e + dir * d)));
    if (!v.every(isFinite)) return false;
    if (!(v[2] > v[1] && v[1] > v[0] && v[2] > 1e3)) return false;
    return Math.log(v[2] / v[1]) / Math.log(1000) >= 0.97;
  };
  return probe(a, 1) || probe(b, -1);
}

/**
 * Definite integral of S over [a, b] (a, b may be +-Infinity). Returns
 * { value, ok, diverges, inconclusive, note }.
 */
function integrateNumeric(S, x, a, b) {
  const f = (t) => numS(S, { [x]: t });
  if (a === b) return { value: 0, ok: true };
  if (a > b) {
    const r = integrateNumeric(S, x, b, a);
    return { ...r, value: -r.value };
  }
  const infinite = !isFinite(a) || !isFinite(b);
  // kinks (abs): split there, also on infinite ranges
  const winLo = isFinite(a) ? a : Math.min(-200, isFinite(b) ? b - 200 : -200);
  const winHi = isFinite(b) ? b : Math.max(200, isFinite(a) ? a + 200 : 200);
  const ks = kinkPoints(S, x, winLo, winHi).filter((t) => t > a && t < b);
  if (infinite && ks.length) {
    const cuts = [a].concat(ks, [b]);
    let total = 0;
    let ok = true;
    for (let i = 0; i + 1 < cuts.length; i++) {
      const r = integrateNumeric(S, x, cuts[i], cuts[i + 1]);
      if (r.diverges) return r;
      total += r.value;
      ok = ok && r.ok;
    }
    return { value: total, ok, inconclusive: !ok };
  }
  if (infinite) {
    let g;
    let lo;
    let hi;
    if (isFinite(a)) {
      g = (t) => f(a + t / (1 - t)) / ((1 - t) * (1 - t));
      lo = 0;
      hi = 1;
    } else if (isFinite(b)) {
      g = (t) => f(b - t / (1 - t)) / ((1 - t) * (1 - t));
      lo = 0;
      hi = 1;
    } else {
      g = (t) => (f(t / (1 - t * t)) * (1 + t * t)) / ((1 - t * t) * (1 - t * t));
      lo = -1;
      hi = 1;
    }
    const r = tanhSinh(g, lo, hi);
    if (r.ok && isFinite(r.value)) return { value: r.value, ok: true };
    // not converged: is it growing (divergent) or just slowly convergent?
    const trunc = (R) => (isFinite(a) ? tanhSinh(f, a, R) : isFinite(b) ? tanhSinh(f, -R, b) : tanhSinh(f, -R, R)).value;
    const i4 = trunc(1e4);
    const i6 = trunc(1e6);
    const grows = !isFinite(i6) || Math.abs(i6 - i4) > 0.05 * (1 + Math.abs(i4));
    return { value: r.value, ok: false, diverges: grows, inconclusive: !grows, note: grows ? 'the integral grows without bound' : 'the numerical method converged too slowly' };
  }
  if (endpointDiverges(f, a, b)) return { value: Infinity, ok: false, diverges: true, note: 'the integrand is not integrable at an endpoint' };
  // singular points strictly inside (a,b): poles or non-finite samples
  const N = 1200;
  const bad = [];
  const vals = [];
  for (let i = 0; i <= N; i++) vals.push(f(a + ((b - a) * i) / N));
  const med = vals.filter(isFinite).map(Math.abs).sort((p, q) => p - q)[Math.floor(vals.length / 2)] || 1;
  for (let i = 1; i < N; i++) {
    const v = vals[i];
    const nb = (Math.abs(vals[i - 1]) + Math.abs(vals[i + 1])) / 2;
    if (!isFinite(v) || (Math.abs(v) > 1e6 * Math.max(1, med) && Math.abs(v) > 20 * nb && Math.abs(v) > 1e6)) bad.push(a + ((b - a) * i) / N);
  }
  // poles that fall between sample points: a sign change that ends in a huge value (not in zero), or a sharp spike whose peak is huge
  const xAt = (i) => a + ((b - a) * i) / N;
  let brackets = 0;
  for (let i = 0; i < N && brackets < 300; i++) {
    const v0 = vals[i];
    const v1 = vals[i + 1];
    if (!isFinite(v0) || !isFinite(v1) || v0 * v1 >= 0) continue;
    brackets++;
    let l = xAt(i);
    let h = xAt(i + 1);
    const sl = Math.sign(v0);
    for (let it = 0; it < 70; it++) {
      const m = (l + h) / 2;
      const fm = f(m);
      if (!isFinite(fm)) break;
      if (Math.sign(fm) === sl) l = m;
      else h = m;
    }
    const peak = Math.max(Math.abs(f(l)), Math.abs(f(h)));
    if (peak > 1e8 * Math.max(1, med)) bad.push((l + h) / 2);
  }
  for (let i = 1; i < N; i++) {
    const v = Math.abs(vals[i]);
    if (!isFinite(v) || v < 8 * Math.max(1, med) || v < Math.abs(vals[i - 1]) || v < Math.abs(vals[i + 1]) || v < 3 * Math.min(Math.abs(vals[i - 1]), Math.abs(vals[i + 1]))) continue;
    let l = xAt(i - 1);
    let h = xAt(i + 1);
    for (let it = 0; it < 80; it++) {
      const m1 = l + (h - l) / 3;
      const m2 = h - (h - l) / 3;
      if (Math.abs(f(m1)) < Math.abs(f(m2))) l = m1;
      else h = m2;
    }
    if (Math.abs(f((l + h) / 2)) > 1e8 * Math.max(1, med)) bad.push((l + h) / 2);
  }
  bad.sort((p, q) => p - q);
  if (bad.length) {
    // one probe per cluster of suspicious points: how fast does |f| grow when we approach it?
    const clusters = bad.filter((t, i) => i === 0 || t - bad[i - 1] > (b - a) / 200);
    for (const x0 of clusters) {
      const probe = (d) => Math.max(Math.abs(f(x0 + d)), Math.abs(f(x0 - d)));
      const p1 = probe(1e-4);
      const p2 = probe(1e-7);
      const p = Math.log(p2 / p1) / Math.log(1000);
      if (isFinite(p) && p >= 0.95) return { value: Infinity, ok: false, diverges: true, note: 'the integrand has a non-integrable singularity near ' + fmtNum(x0) };
    }
    const x0 = bad[Math.floor(bad.length / 2)];
    const cuts = [a].concat(bad.filter((t, i) => i === 0 || t - bad[i - 1] > (b - a) / 50), [b]);
    let total = 0;
    let ok = true;
    for (let i = 0; i + 1 < cuts.length; i++) {
      const r = tanhSinh(f, cuts[i], cuts[i + 1]);
      total += r.value;
      ok = ok && r.ok;
    }
    return { value: total, ok, note: 'the integrand is unbounded near ' + fmtNum(x0) + ' but the integral converges' };
  }
  const cuts = [a].concat(ks, [b]);
  let total = 0;
  let ok = true;
  let err = 0;
  for (let i = 0; i + 1 < cuts.length; i++) {
    if (cuts[i + 1] - cuts[i] < 1e-12) continue;
    const r = tanhSinh(f, cuts[i], cuts[i + 1]);
    total += r.value;
    err += r.error;
    ok = ok && r.ok;
  }
  return { value: total, ok: ok && isFinite(total), error: err };
}

// ======================================================================
// 9b. Symbolic integration (antiderivatives)
//     table + linear substitution, polynomials, rational functions (partial fractions),
//     exp*trig, trig powers/products, sqrt of quadratics, u-substitution, integration by parts.
//     Every answer is verified by differentiating it and comparing with the integrand.
// ======================================================================
let FRESH_N = 0;
const freshVar = () => '$u' + ++FRESH_N;
const FRESH = '$u'; // used by sums and other callers that substitute once
class GiveUp extends Error {}
let IB = { steps: 0, deadline: 0 };
function tick() {
  if (++IB.steps > 4000 || Date.now() > IB.deadline) throw new GiveUp('budget');
}

function replaceS(e, k, rep) {
  if (key(e) === k) return rep;
  if (e.k === '+' || e.k === '*' || e.k === '^' || e.k === 'f') return mapS(e, (t) => replaceS(t, k, rep));
  return e;
}
/** Replace u by W; if u = b^(L(x)), also b^(r*L(x)) -> W^r. */
function replaceExpS(e, u, W, x) {
  if (key(e) === key(u)) return W;
  if (e.k === '^' && u.k === '^' && key(e.b) === key(u.b) && freeOf(u.b, x) && !freeOf(e.e, x)) {
    const ratio = simp(sDiv(e.e, u.e));
    if (freeOf(ratio, x)) return sPow(W, ratio);
  }
  if (e.k === '+' || e.k === '*' || e.k === '^' || e.k === 'f') return mapS(e, (t) => replaceExpS(t, u, W, x));
  return e;
}
/** u = a*x + b with a, b free of x  ->  {a, b}; else null */
function linearIn(u, x) {
  if (freeOf(u, x)) return null;
  const c = polyCoeffsS(u, x);
  if (!c || c.length !== 2) return null;
  return { a: c[1], b: c[0] };
}
const sLnAbs = (u) => sFn('ln', [sFn('abs', [u])]);
const verifyAnti = (F, f, x) => {
  try {
    return sameFunction(diffS(F, x), f);
  } catch (e) {
    return false;
  }
};

// ---- method: table of standard integrals with a linear inner function -----------------------------
function mTable(f, x) {
  if (f.k === 'f' && f.a.length === 1) {
    const u = f.a[0];
    const L = linearIn(u, x);
    if (!L) return null;
    let F;
    switch (f.fn) {
      case 'sin': F = sNeg(sFn('cos', [u])); break;
      case 'cos': F = sFn('sin', [u]); break;
      case 'tan': F = sNeg(sLnAbs(sFn('cos', [u]))); break;
      case 'cot': F = sLnAbs(sFn('sin', [u])); break;
      case 'sec': F = sLnAbs(sAdd([sFn('sec', [u]), sFn('tan', [u])])); break;
      case 'csc': F = sNeg(sLnAbs(sAdd([sFn('csc', [u]), sFn('cot', [u])]))); break;
      case 'sinh': F = sFn('cosh', [u]); break;
      case 'cosh': F = sFn('sinh', [u]); break;
      case 'tanh': F = sFn('ln', [sFn('cosh', [u])]); break;
      case 'ln': F = sSub(sMul([u, sFn('ln', [u])]), u); break;
      case 'asin': F = sAdd([sMul([u, sFn('asin', [u])]), sSqrt(sSub(S1, sPow(u, sI(2))))]); break;
      case 'acos': F = sSub(sMul([u, sFn('acos', [u])]), sSqrt(sSub(S1, sPow(u, sI(2))))); break;
      case 'atan': F = sSub(sMul([u, sFn('atan', [u])]), half(sFn('ln', [sAdd([S1, sPow(u, sI(2))])]))); break;
      case 'abs': F = half(sMul([u, sFn('abs', [u])])); break;
      case 'erf': F = sAdd([sMul([u, sFn('erf', [u])]), sDiv(sExp(sNeg(sPow(u, sI(2)))), sSqrt(S_PI))]); break;
      default: return null;
    }
    return sDiv(F, L.a);
  }
  if (f.k === '^') {
    const { b, e } = f;
    if (freeOf(e, x)) {
      const L = linearIn(b, x);
      if (L && e.k === 'n') {
        if (e.q.eq(qInt(-1))) return sDiv(sLnAbs(b), L.a);
        return sDiv(sPow(b, sAdd([e, S1])), sMul([L.a, sAdd([e, S1])]));
      }
      if (b.k === 'f' && b.a.length === 1 && e.k === 'n' && e.q.isInt()) {
        const u = b.a[0];
        const L2 = linearIn(u, x);
        if (L2) {
          const m = Number(e.q.n);
          let F = null;

const qList = (qs) => qs.map((q) => q.toString());
const qParen = (q) => (q.isInt() && q.sign() >= 0 ? q.toString() : '(' + q.toString() + ')');
function binomPoly(k) {
  // C(n - 1, k) as a polynomial in n
  let P = [Q1];
  for (let i = 1; i <= k; i++) P = pmul(P, [qInt(-i), Q1]);
  const f = bigFactorial(BigInt(k));

function fitSequence(vals) {
  const N = vals.length;
  const rows = [vals];
  while (rows[rows.length - 1].length > 1) {
    const r = rows[rows.length - 1];
    rows.push(r.slice(1).map((v, i) => v.sub(r[i])));
  }
  let deg = -1;
  for (let d = 0; d <= 6 && d + 2 <= N; d++) {
    const row = rows[d];
    if (row.every((v) => v.eq(row[0]))) {
      deg = d;
      break;
    }
  }
  if (deg >= 0) return { kind: 'poly', deg, rows, confirmed: true };
  // geometric
  if (N >= 3 && !vals[0].isZero() && vals.slice(1).every((v, i) => !vals[i].isZero() && v.div(vals[i]).eq(vals[1].div(vals[0])))) {
    return { kind: 'geom', ratio: vals[1].div(vals[0]) };
  }
  // Fibonacci-like and second-order linear recurrences
  if (N >= 4 && vals.slice(2).every((v, i) => v.eq(vals[i].add(vals[i + 1])))) return { kind: 'rec', p: Q1, q: Q1 };
  if (N >= 5) {
    const det = vals[1].mul(vals[1]).sub(vals[0].mul(vals[2]));
    if (!det.isZero()) {
      const p = vals[2].mul(vals[1]).sub(vals[0].mul(vals[3])).div(det);
      const q = vals[1].mul(vals[3]).sub(vals[2].mul(vals[2])).div(det);
      if (vals.slice(2).every((v, i) => v.eq(p.mul(vals[i + 1]).add(q.mul(vals[i]))))) return { kind: 'rec', p, q };
    }
  }
  // few terms: fit the polynomial of lowest degree through all of them
  if (N <= 5) return { kind: 'poly', deg: N - 1, rows, confirmed: false };

}

/** Called by normalizeText: turns "17 mod 5", "3x \u2261 4 (mod 7)", "255 to binary", "5 choose 2" into commands. */
function convertDiscrete(s) {
  if (!/mod|\u2261|equiv|binary|octal|hex|base|choose|0[xbo][0-9a-f]|integer|diophant|\bc\(|\bp\(|\d[cp]\d|_|anagram|arrang|permut/i.test(s)) return s;
  s = convertWordCounting(s);
  s = s.replace(/\\equiv/g, '\u2261').replace(/\\pmod\s*\{([^{}]*)\}/g, ' mod $1').replace(/\\bmod/g, ' mod ').replace(/\\pmod\s*(\d+)/g, ' mod $1');
  // congruences  L \u2261 R (mod m)
  s = s.replace(/([^\n;,\u2261]+?)\s*(?:\u2261|\bcongruent\s+to\b)\s*([^\n;,\u2261]+?)\s*[(,]?\s*(?:\bmod\b|\bmodulo\b)\s*(\d+)\s*\)?/gi, (m, l, r, mod) => {
    l = l.replace(/^[\s:]*(?:(?:solve|find|and|the|system|of|congruences?|such\s+that)\b[\s:]*)+/i, '');
    return 'congruence(' + l.trim() + ', ' + r.trim() + ', ' + mod + ')';
  });
  // a system x \u2261 a (mod m), x \u2261 b (mod n) ...  ->  crt
  const sys = [];
  s.replace(/congruence\(\s*([a-z])\s*,\s*(-?\d+)\s*,\s*(\d+)\s*\)/gi, (m, v, a, mo) => { sys.push({ v, a, mo, m }); return m; });
  if (sys.length >= 2 && sys.every((t) => t.v === sys[0].v)) {
    const first = s.indexOf(sys[0].m);
    const lastT = sys[sys.length - 1].m;
    const last = s.lastIndexOf(lastT) + lastT.length;
    s = s.slice(0, first) + 'crt([' + sys.map((t) => t.a).join(', ') + '], [' + sys.map((t) => t.mo).join(', ') + '])' + s.slice(last);
  }
  // integer solutions of a linear equation
  s = s.replace(/(?:integer\s+solutions?\s+(?:of|to|for)|diophantine(?:\s+equation)?|solve\s+in\s+(?:the\s+)?integers?)\s*[:]?\s*([^=;\n]+?)\s*=\s*([^;\n]+?)\s*(?:\bin\s+(?:the\s+)?integers?)?\s*$/gim, 'diophantine($1, $2)');
  s = s.replace(/(^|[;\n])\s*(?:find\s+|solve\s+)?([^=;\n]+?)\s*=\s*([^;\n]+?)\s*,?\s*\b(?:in|over)\s+(?:the\s+)?(?:integers|whole numbers|z)\b/gi, '$1diophantine($2, $3)');
  // a mod m
  s = s.replace(/(-?\d+|\([^()]+\))\s+mod\s+(\d+)/gi, 'mod($1, $2)');
  // choose / permute
  s = s.replace(/(\d+)\s*choose\s*(\d+)/gi, 'ncr($1, $2)');
  s = s.replace(/\b(?:c|ncr)\(\s*(\d+)\s*,\s*(\d+)\s*\)/gi, 'ncr($1, $2)');
  s = s.replace(/\b(?:p|npr)\(\s*(\d+)\s*,\s*(\d+)\s*\)/gi, 'npr($1, $2)');
  s = s.replace(/(^|[^a-z0-9_.])(\d+)([cp])(\d+)(?![a-z0-9_.])/gi, (m, pre, a, f, b) => pre + (f.toLowerCase() === 'c' ? 'ncr(' : 'npr(') + a + ', ' + b + ')');
  // number bases
  s = s.replace(/(^|[^a-z0-9_.])0x([0-9a-f]+)\b/gi, (m, pre, h) => pre + BigInt('0x' + h).toString());
  s = s.replace(/(^|[^a-z0-9_.])0b([01]+)\b/gi, (m, pre, h) => pre + BigInt('0b' + h).toString());
  s = s.replace(/(^|[^a-z0-9_.])0o([0-7]+)\b/gi, (m, pre, h) => pre + BigInt('0o' + h).toString());
  s = s.replace(/\(\s*([0-9a-z]+)\s*\)\s*_\s*[({]?\s*(\d{1,2})\s*[)}]?/gi, (m, d, b) => (/^[0-9]+$/.test(d) ? 'frombase(' + d + ', ' + b + ')' : String(parseBase(d, +b))));
  s = s.replace(/(^|[^a-z0-9_.])(\d+)\s*_\s*[({]?\s*(\d{1,2})\s*[)}]?(?![\d.])/gi, (m, pre, d, b) => pre + 'frombase(' + d + ', ' + b + ')');
  s = s.replace(/(?:convert\s+)?(\d+)\s*(?:in|to|into|as)\s+(binary|octal|hexadecimal|hex)\b/gi, (m, v, name) => (/^b/i.test(name) ? 'binary(' : /^o/i.test(name) ? 'octal(' : 'hex(') + v + ')');
  s = s.replace(/(?:convert\s+)?(\d+)\s*(?:to|in|into)\s+base\s+(\d{1,2})\b/gi, 'tobase($1, $2)');
  s = s.replace(/\b(binary|octal|hexadecimal|hex)\s+(?:of|for)\s+(\d+)/gi, (m, name, v) => (/^b/i.test(name) ? 'binary(' : /^o/i.test(name) ? 'octal(' : 'hex(') + v + ')');
  s = s.replace(/(\d+)\s*base\s*(\d{1,2})\b/gi, 'frombase($1, $2)');
  return s;
}
function parseBase(digits, b) {
  let v = 0n;
  for (const c of digits.toLowerCase()) {
    const d = parseInt(c, 36);
    if (isNaN(d) || d >= b) throw new MathError('the digit ' + c + ' is not allowed in base ' + b);
    v = v * BigInt(b) + BigInt(d);
  }
  return v;
}

/** ways[s] = number of ways n dice with `sides` faces add up to s (exact, big integers) */
function diceWays(nDice, sides) {
  let ways = new Map([[0, 1n]]);
  for (let i = 0; i < nDice; i++) {
    const next = new Map();
    ways.forEach((w, s) => {
      for (let f = 1; f <= sides; f++) next.set(s + f, (next.get(s + f) || 0n) + w);
    });
    ways = next;
  }
  return ways;
}

const RAD = Math.PI / 180;
const fa = (x) => fmtNum(x);
function triangleReport(t, out, given) {

  out.answer.push('angles: A = ' + fa(A / RAD) + '\u00b0,  B = ' + fa(B / RAD) + '\u00b0,  C = ' + fa(C / RAD) + '\u00b0');

function trianglesFromParts(P) {
  // P: {a,b,c,A,B,C} with A,B,C in radians; returns a list of full solutions
  const sides = ['a', 'b', 'c'].filter((k) => P[k] !== undefined);
  const angs = ['A', 'B', 'C'].filter((k) => P[k] !== undefined);
  const opp = { a: 'A', b: 'B', c: 'C', A: 'a', B: 'b', C: 'c' };
  if (sides.length + angs.length !== 3) throw new MathError('give exactly three parts of the triangle (for example a=3, b=4, C=60), at least one of them a side');
  if (!sides.length) throw new MathError('three angles do not determine the size of a triangle; give at least one side');
  const full = (a, b, c) => {
    const A = Math.acos(Math.max(-1, Math.min(1, (b * b + c * c - a * a) / (2 * b * c))));
    const B = Math.acos(Math.max(-1, Math.min(1, (a * a + c * c - b * b) / (2 * a * c))));
    return { a, b, c, A, B, C: Math.PI - A - B };

  const tri = (a, b, c) => a + b > c + 1e-12 * c && a + c > b + 1e-12 * b && b + c > a + 1e-12 * a;
  if (sides.length === 3) {
    if (!tri(P.a, P.b, P.c)) throw new MathError('these sides cannot form a triangle (the two shorter ones must add up to more than the longest)');
    return { kind: 'SSS', sols: [full(P.a, P.b, P.c)] };
  }

    const ang = angs[0];
    const third = ['a', 'b', 'c'].find((k) => !sides.includes(k));
    if (opp[ang] === third) {
      // SAS: the angle lies between the two given sides
      const [x, y] = sides.map((k) => P[k]);
      const z = Math.sqrt(x * x + y * y - 2 * x * y * Math.cos(P[ang]));
      const s3 = { ...P, [third]: z };
      return { kind: 'SAS', sols: [full(s3.a, s3.b, s3.c)] };
    }

    const known = opp[ang];
    const other = sides.find((k) => k !== known);
    const sinO = (P[other] * Math.sin(P[ang])) / P[known];

      T[thirdAngle] = third2;

    }

  const T = { ...P };

  T[third] = Math.PI - angs.reduce((s, k) => s + P[k], 0);

  const fromK = { C: (x) => x.sub(qNum('273.15')), K: (x) => x, F: (x) => x.mul(new Q(9n, 5n)).sub(qNum('459.67')), R: (x) => x.mul(new Q(9n, 5n)) };
  return fromK[to](toK[from](q));
}
function trimDecimal(x) {
  return fmtNum(x);
}
defCmd('convert', (n) => {

  if (fromName === undefined || toName === undefined) throw new MathError('write the conversion as, for example, convert 5 km to miles');
  const S = fromAst(n.args[0]);
  if (varsOfS(S).size) throw new MathError('a number is needed in front of the unit');
  const out = newOut();
  const tf = tempKind(fromName);
  const tt = tempKind(toName);
  if (tf && tt) {
    if (S.k !== 'n') throw new MathError('temperatures must be plain numbers');
    const r = convertTemperature(S.q, tf, tt);
    out.answer.push(S.q.toString() + ' \u00b0' + tf + ' = ' + qText(r) + ' \u00b0' + tt);
    out.work.push('Temperature scales differ by an offset as well as a factor');
    out.value = { q: r };

  }
  const a = parseUnit(fromName);
  const b = parseUnit(toName);
  if (!a) throw new MathError('I do not know the unit "' + fromName + '"');
  if (!b) throw new MathError('I do not know the unit "' + toName + '"');
  if (!sameDims(a.d, b.d)) throw new MathError('cannot convert ' + dimsName(a.d) + ' (' + fromName + ') to ' + dimsName(b.d) + ' (' + toName + ')');
  const factor = simp(sDiv(a.f, b.f));
  const res = simp(sMul([S, factor]));
  const nice = (q) => (q.d <= 100n && babs(q.n) < 10n ** 12n ? qText(q) : fmtNum(q.toNumber()));
  const shown = res.k === 'n' ? nice(res.q) : symText(res);
  out.answer.push(showRaw(n.args[0]) + ' ' + fromName + ' = ' + shown + ' ' + toName);
  out.work.push('1 ' + fromName + ' = ' + (factor.k === 'n' ? (factor.q.d <= 1000n && babs(factor.q.n) < 10n ** 9n ? factor.q.toString() : fmtNum(factor.q.toNumber())) : trimDecimal(numS(factor, {}))) + ' ' + toName);
  out.value = { S: res };
  return out;
});

/** "Ca(OH)2", "CuSO4\u00b75H2O", "Fe2(SO4)3" -> Map(element -> count). */
function parseFormula(str) {
  const text = str.replace(/\s+/g, '').replace(/\*/g, '\u00b7').replace(/\.(?=\d*[A-Z(])/g, '\u00b7');
  const chunks = text.split('\u00b7');
  const total = new Map();
  chunks.forEach((chunk) => {
    const lead = /^(\d+)(.*)$/.exec(chunk);
    const mult = lead ? Number(lead[1]) : 1;
    const body = lead ? lead[2] : chunk;
    let i = 0;
    const parseGroup = (close) => {
      const counts = new Map();
      while (i < body.length && body[i] !== close) {
        const c = body[i];
        let sub;
        if (c === '(' || c === '[') {
          i++;
          sub = parseGroup(c === '(' ? ')' : ']');
          if (i >= body.length) throw new MathError('unbalanced brackets in the formula ' + str);
          i++;
        } else if (/[A-Z]/.test(c)) {
          let sym = c;
          i++;
          while (i < body.length && /[a-z]/.test(body[i]) && ATOM[sym + body[i]]) { sym += body[i]; i++; }
          if (!ATOM[sym]) throw new MathError('unknown element "' + sym + '" in ' + str);
          sub = new Map([[sym, 1]]);
        } else throw new MathError('cannot read "' + c + '" in the formula ' + str);
        let num = '';
        while (i < body.length && /\d/.test(body[i])) { num += body[i]; i++; }
        const k = num ? Number(num) : 1;
        sub.forEach((v, e) => counts.set(e, (counts.get(e) || 0) + v * k));
      }
      return counts;
    };
    const g = parseGroup(null);
    g.forEach((v, e) => total.set(e, (total.get(e) || 0) + v * mult));
  });
  if (!total.size) throw new MathError('empty formula');
  return total;
}

}

defCmd('balance', (n) => {
  needArgs(n, 1, 1, 'a reaction such as H2 + O2 -> H2O');
  const rxn = CHEM_ARGS[Number(intArg(n.args[0]))];
  if (rxn === undefined) throw new MathError('write the reaction as balance H2 + O2 -> H2O');
  const sides = rxn.split(/->|=>|\u2192|\u27f6|\u21cc|=|==/);
  if (sides.length !== 2) throw new MathError('the reaction needs one arrow, e.g. H2 + O2 -> H2O');
  const split = (t) => t.split(/\s+\+\s+|\s*\+\s*(?=[0-9]*[A-Z(])/).map((x) => x.trim().replace(/^\d+(?=[A-Z(])/, '')).filter(Boolean);
  const left = split(sides[0]);
  const right = split(sides[1]);
  if (!left.length || !right.length) throw new MathError('there must be something on both sides of the arrow');
  const species = left.concat(right);
  const counts = species.map(parseFormula);
  const elements = Array.from(new Set(counts.flatMap((c) => Array.from(c.keys()))));
  const rows = elements.map((e) => species.map((_, j) => qInt(counts[j].get(e) || 0).mul(j < left.length ? Q1 : qInt(-1))));
  const basis = mNullspace(rows);
  const out = newOut();
  if (basis.length !== 1) {
    out.answer.push(basis.length ? 'this reaction can be balanced in several independent ways (' + basis.length + ' free choices)' : 'this reaction cannot be balanced with these formulas');
    return out;
  }
  let v = primitiveVector(basis[0]);
  if (v.some((q) => q.sign() < 0)) v = v.map((q) => q.neg());
  if (v.some((q) => q.sign() <= 0) || v.some((q) => !q.isInt())) {
    out.answer.push('no balance with positive whole-number coefficients exists for these formulas');
    return out;
  }
  const term = (name, q) => (q.eq(Q1) ? '' : q.toString()) + name;
  out.answer.push(left.map((s, j) => term(s, v[j])).join(' + ') + ' \u2192 ' + right.map((s, j) => term(s, v[left.length + j])).join(' + '));
  out.work.push('Solved the atom-conservation equations for each element (' + elements.join(', ') + ') exactly and took the smallest whole numbers');
  out.check = elements.map((e) => e + ': ' + left.reduce((s, _, j) => s + (counts[j].get(e) || 0) * Number(v[j].n), 0) + ' = ' + right.reduce((s, _, j) => s + (counts[left.length + j].get(e) || 0) * Number(v[left.length + j].n), 0)).join(', ');
  return out;
});

/** A rate: 5% or 5 means 5 percent, 0.05 means 5 percent too (values below 1 are taken as fractions). */
function rateOf(node) {
  const S = fromAst(node);
  if (S.k !== 'n') throw new MathError('the interest rate must be a number');
  const q = S.q;
  if (node.t === 'pct') return q;
  return q.abs().sub(Q1).sign() >= 0 ? q.div(qInt(100)) : q;
}
function money(q) {
  return decimalText(roundQ(q, 2), 2);
}
function roundQ(q, d) {
  const scale = qInt(10).pow(d);
  const x = q.mul(scale);
  const r = x.sign() >= 0 ? floorQ(x.add(new Q(1n, 2n))) : floorQ(x.neg().add(new Q(1n, 2n))).neg();
  return r.div(scale);
}

});

defCmd('irr', (n) => {
  const cf = cashflows(n, 0);
  const f = (r) => cf.reduce((s, c, t) => s + c / Math.pow(1 + r, t), 0);
  let lo = -0.99;
  let hi = 10;
  let flo = f(lo);
  if (flo * f(hi) > 0) throw new MathError('no internal rate of return was found (the cash flows must change sign)');
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    const fm = f(mid);
    if (flo * fm <= 0) hi = mid;
    else {
      lo = mid;
      flo = fm;
    }
  }
  const out = newOut();
  out.work.push('The rate at which the net present value is 0');
  out.answer.push('IRR = ' + fmtNum(((lo + hi) / 2) * 100) + ' %');
  out.value = { num: (lo + hi) / 2 };
  return out;
});

function drawPlot(spec) {
  const { curves, xr, yr, labels, equal } = spec;
  const canvas = document.createElement('canvas');
  canvas.width = PLOT_W;
  canvas.height = PLOT_H;
  const g = canvas.getContext('2d');
  const L = 54;
  const R = 14;
  const T = 14;
  const B = 34;
  let [x0, x1] = xr;
  let [y0, y1] = yr;

    const sx = (x1 - x0) / (PLOT_W - L - R);
    const sy = (y1 - y0) / (PLOT_H - T - B);
    const s = Math.max(sx, sy);
    const cx = (x0 + x1) / 2;
    const cy = (y0 + y1) / 2;
    x0 = cx - (s * (PLOT_W - L - R)) / 2;
    x1 = cx + (s * (PLOT_W - L - R)) / 2;
    y0 = cy - (s * (PLOT_H - T - B)) / 2;
    y1 = cy + (s * (PLOT_H - T - B)) / 2;
  }

  const syTick = niceStep(y1 - y0, 6);

  g.lineWidth = 1;
  g.strokeStyle = '#e3e3e3';
  g.fillStyle = '#555555';
  g.textAlign = 'center';

    g.beginPath();

  curves.forEach((pts, k) => {

    g.lineJoin = 'round';

    g.beginPath();
    pts.forEach((p) => {
      if (!p) {
        prev = null;
        return;
      }
      const X = px(p.x);
      const Y = py(p.y);
      const big = Math.abs(Y) > 1e5;

    g.fillStyle = m.color || '#000000';
    g.beginPath();
    g.arc(px(m.x), py(m.y), 4, 0, 2 * Math.PI);
    g.fill();

  g.restore();

  g.font = '13px sans-serif';
  g.textAlign = 'left';
  g.textBaseline = 'middle';
  const lw = Math.min(PLOT_W - L - R - 12, 14 + Math.max(...labels.map((s) => g.measureText(s).width)) + 12);
  g.fillStyle = 'rgba(255,255,255,0.88)';
  g.fillRect(L + 6, T + 6, lw, labels.length * 18 + 6);
  labels.forEach((s, k) => {
    g.fillStyle = PLOT_COLORS[k % PLOT_COLORS.length];
    g.fillRect(L + 12, T + 18 + k * 18 - 4, 14, 4);
    g.fillStyle = '#111111';
    g.fillText(s, L + 32, T + 18 + k * 18);
  });

}

defCmd('plot graph', (n) => {
  let args = n.args.slice();
  let v = null;
  let range = [-10, 10];
  if (args.length >= 3 && args[args.length - 3].t === 'var' && ['num', 'neg', 'bin', 'const', 'call'].includes(args[args.length - 2].t)) {
    v = args[args.length - 3].name;
    range = rangeFrom(args, args.length - 3);
    args = args.slice(0, -3);
  } else if (args.length >= 2 && args[args.length - 1].t === 'var' && args.length > 1) {
    v = args[args.length - 1].name;
    args = args.slice(0, -1);
  }
  if (!args.length) throw new MathError('plot needs at least one function, e.g. plot(sin(x), x, -6.28, 6.28)');
  if (args.length > 6) throw new MathError('at most 6 functions per graph');
  if (!v) {
    const vars = new Set();
    args.forEach((a) => collectVars(a, vars));
    if (vars.size > 1) throw new MathError('plot: several letters (' + sortedVars(vars).join(', ') + '); say which is the variable, e.g. plot(' + showRaw(args[0]) + ', x, -5, 5)');
    v = vars.size ? Array.from(vars)[0] : 'x';
  }
  const fns = args.map((a) => {
    const node = a.t === 'named' ? a.a : a;
    const vars = collectVars(node, new Set());
    vars.delete(v);
    if (vars.size) throw new MathError('plot: unknown letter ' + Array.from(vars).join(', ') + ' (only ' + v + ' may appear)');
    return (x) => evalNum(node, { [v]: x });
  });
  const labels = args.map((a) => 'y = ' + showRaw(a.t === 'named' ? a.a : a));
  const curves = fns.map((f) => sampleCurve((t) => t, f, range[0], range[1], 900));
  const yr = robustYRange(curves);
  const out = newOut();
  out.answer.push('Graph of ' + labels.join(',  ') + '  for ' + v + ' from ' + fmtNum(range[0]) + ' to ' + fmtNum(range[1]) + ' (the picture is shown in the chat)');
  const marks = [];
  fns.forEach((f, k) => {
    const info = analyseFunction(f, range[0], range[1]);
    const z = dedupeNum(info.zeros);
    const pre = args.length > 1 ? labels[k] + ': ' : '';
    if (z.length) out.work.push(pre + 'zeros (x-intercepts) at ' + v + ' \u2248 ' + z.slice(0, 8).map(fmtNum).join(', ') + (z.length > 8 ? ', \u2026' : ''));
    else out.work.push(pre + 'no zeros in this range');
    if (info.yint !== null) out.work.push(pre + 'y-intercept: ' + fmtNum(info.yint));
    info.extrema.slice(0, 6).forEach((e) => out.work.push(pre + (e.max ? 'local maximum' : 'local minimum') + ' near (' + fmtNum(e.x) + ', ' + fmtNum(e.y) + ')'));
    if (args.length === 1) {
      z.slice(0, 8).forEach((x) => marks.push({ x, y: 0, color: '#000000' }));
      info.extrema.slice(0, 6).forEach((e) => marks.push({ x: e.x, y: e.y, color: e.max ? '#d62728' : '#2ca02c' }));
    }
  });
  return finishPlot(out, { curves, xr: range, yr, labels, marks });
});
COMMANDS.plot.show = (n) => 'graph of ' + n.args.map(showRaw).join(', ');
defCmd('plotparam parametric', (n) => {
  const args = plotArgs(n, 5);
  if (args.length !== 5 || args[2].t !== 'var') throw new MathError('plotparam(x(t), y(t), t, from, to)  - for example plotparam(cos(t), sin(t), t, 0, 2*pi)');
  const v = args[2].name;
  const range = rangeFrom(args, 2);
  const mk = (node) => {
    const vars = collectVars(node, new Set());
    vars.delete(v);
    if (vars.size) throw new MathError('only ' + v + ' may appear');
    return (t) => evalNum(node, { [v]: t });
  };
  const fx = mk(args[0]);
  const fy = mk(args[1]);
  const curve = sampleCurve(fx, fy, range[0], range[1], 1200);
  const xs = curve.filter(Boolean).map((p) => p.x);
  if (!xs.length) throw new MathError('nothing to draw in this range');
  const ys = curve.filter(Boolean).map((p) => p.y);
  const pad = (a, b) => (b > a ? (b - a) * 0.08 : 1);
  const xr = [Math.min(...xs) - pad(Math.min(...xs), Math.max(...xs)), Math.max(...xs) + pad(Math.min(...xs), Math.max(...xs))];
  const yr = [Math.min(...ys) - pad(Math.min(...ys), Math.max(...ys)), Math.max(...ys) + pad(Math.min(...ys), Math.max(...ys))];
  const out = newOut();
  const labels = ['x = ' + showRaw(args[0]) + ',  y = ' + showRaw(args[1])];
  out.answer.push('Parametric curve ' + labels[0] + '  for ' + v + ' from ' + fmtNum(range[0]) + ' to ' + fmtNum(range[1]) + ' (the picture is shown in the chat)');
  out.work.push('x ranges over [' + fmtNum(Math.min(...xs)) + ', ' + fmtNum(Math.max(...xs)) + '],  y over [' + fmtNum(Math.min(...ys)) + ', ' + fmtNum(Math.max(...ys)) + ']');
  return finishPlot(out, { curves: [curve], xr, yr, labels, equal: true });
});
defCmd('plotpolar', (n) => {
  const args = plotArgs(n, 4);
  if (args.length !== 4 || args[1].t !== 'var') throw new MathError('plotpolar(r(t), t, from, to)  - for example plotpolar(1 + cos(t), t, 0, 2*pi)');
  const v = args[1].name;
  const range = rangeFrom(args, 1);
  const vars = collectVars(args[0], new Set());
  vars.delete(v);
  if (vars.size) throw new MathError('only ' + v + ' may appear');
  const fr = (t) => evalNum(args[0], { [v]: t });
  const curve = sampleCurve((t) => fr(t) * Math.cos(t), (t) => fr(t) * Math.sin(t), range[0], range[1], 1600);
  const pts = curve.filter(Boolean);
  if (!pts.length) throw new MathError('nothing to draw in this range');
  const xs = pts.map((p) => p.x);
  const ys = pts.map((p) => p.y);
  const m = Math.max(...xs.map(Math.abs), ...ys.map(Math.abs)) * 1.1 || 1;
  const out = newOut();
  const labels = ['r = ' + showRaw(args[0])];
  out.answer.push('Polar curve ' + labels[0] + '  for ' + v + ' from ' + fmtNum(range[0]) + ' to ' + fmtNum(range[1]) + ' (the picture is shown in the chat)');
  out.work.push('largest distance from the origin \u2248 ' + fmtNum(Math.max(...pts.map((p) => Math.hypot(p.x, p.y)))));
  return finishPlot(out, { curves: [curve], xr: [-m, m], yr: [-m, m], labels, equal: true });
});

/** "plot y = x^2", "graph f(x) = sin(x) from -5 to 5" -> plot(...) */
function convertPlotWords(s) {
  const m = /^\s*(?:please\s+)?(?:plot|graph|sketch|draw)\s+(?:the\s+)?(?:graph\s+of\s+|function\s+|curve\s+)?(?:y|f\s*\(\s*x\s*\)|g\s*\(\s*x\s*\))\s*=\s*([^;\n]+?)(?:\s+(?:from|for|on|over)\s+(?:x\s*=\s*)?(-?[0-9.]+(?:\s*\*?\s*pi)?)\s+(?:to|and|-)\s+(-?[0-9.]+(?:\s*\*?\s*pi)?))?\s*$/i.exec(s);
  if (!m) return s;
  return 'plot(' + m[1] + (m[2] ? ', x, ' + m[2] + ', ' + m[3] : '') + ')';
}

  '  suvat(u=0, a=9.8, t=3)  (give 3 of s u v a t)   projectile(20, 30)  (speed, angle in degrees)   freefall(45)',
  '  any physics formula: write it as an equation and solve for a letter  (F = m*a;  v^2 = u^2 + 2*a*s solve for s)',
].join('\n');
HELP.plot = [
  'PLOTS (the picture is returned to the chat; zeros, extrema and the y-intercept are listed)',
  '  plot(sin(x), x, -2*pi, 2*pi)     plot(x^2, 2x+3, x, -3, 4)  (up to 6 functions)     plot y = x^2 - 4',
  '  plotparam(cos(t), sin(2t), t, 0, 2*pi)       plotpolar(1 + cos(t), t, 0, 2*pi)',
].join('\n');
const HELP_ALIAS = {
  '': 'index', help: 'index', commands: 'index', all: 'index', topics: 'index', input: 'syntax', notation: 'syntax', solve: 'equations', inequalities: 'equations', systems: 'equations', formulas: 'equations',
  diffeq: 'ode', differential: 'ode', odes: 'ode', 'differential equations': 'ode', laplace: 'ode', transforms: 'ode', lp: 'optimize', optimization: 'optimize', lagrange: 'multivar', multivariable: 'multivar', vectorcalculus: 'multivar', integrals: 'calculus', derivatives: 'calculus', limits: 'calculus', series: 'calculus', complex: 'algebra', matrices: 'matrix', vectors: 'matrix', linear: 'matrix', 'linear algebra': 'matrix',
  discrete: 'number', counting: 'number', probability: 'stats', statistics: 'stats', geometry: 'geometry', conic: 'geometry', conics: 'geometry', triangles: 'geometry',
  finance: 'units', chemistry: 'units', physics: 'units', conversion: 'units', graph: 'plot', plots: 'plot', plotting: 'plot', graphs: 'plot',
};
/** The help text for a request such as "help", "help calculus" or "commands", else null. */
function helpFor(text) {
  const m = /^\s*(?:please\s+)?(?:help|commands|what\s+can\s+you\s+do|\?)\s*(?:me\s+)?(?:with\s+|on\s+|about\s+|for\s+)?([a-z ]*?)\s*[?.!]*\s*$/i.exec(String(text));
  if (!m) return null;
  const topic = m[1].toLowerCase().trim();
  const key0 = HELP[topic] ? topic : HELP_ALIAS[topic];
  if (!key0 || !HELP[key0]) return HELP.index + '\n(unknown topic "' + topic + '")';
  return HELP[key0];
}
// ======================================================================
// 16. Linear programming:  "maximize 3x + 2y subject to x + y <= 4, x <= 3, x >= 0, y >= 0"
//     Exact: every vertex of the feasible region is found with rational arithmetic.
//     Add the word "integer(s)" to restrict the variables to whole numbers.
// ======================================================================
const LP_START = /^\s*(?:please\s+)?(maxim(?:ize|ise)|minim(?:ize|ise)|max|min)\b(?!\s*\()\s*:?\s*([\s\S]*)$/;
const LP_BIG = qInt(10).pow(9);

function splitObjective(rest) {
  const m = /(?:\b(?:subject\s+to|such\s+that|where|given|constraints?|under)\b|\bs\.\s?t\.|\bs\/t\b)\s*:?|:/.exec(rest);
  if (m) return [rest.slice(0, m.index), rest.slice(m.index + m[0].length)];
  const parts = rest.split(/[;\n]/);
  if (parts.length > 1) return [parts[0], parts.slice(1).join(';')];
  return null;
}
function lpConstraintTexts(text) {
  let s = text.replace(/\band\b/g, ';');
  // "x, y >= 0" -> "x >= 0; y >= 0"
  s = s.replace(/((?:\u0002?[a-z](?:_\(?\w+\)?)?\s*,\s*)+\u0002?[a-z](?:_\(?\w+\)?)?)\s*(>=|<=|>|<)\s*([^,;\n]+)/g, (m, vars, op, rhs) => vars.split(',').map((v) => v.trim() + ' ' + op + ' ' + rhs.trim()).join('; '));
  return s.split(/[;\n,]/).map((t) => t.trim()).filter(Boolean);
}
const LP_SHOW = { '<=': '\u2264', '>=': '\u2265', '<': '<', '>': '>', '=': '=' };

function solveSquare(A, b) {
  const n = A.length;
  const { M, pivots, inconsistent } = rrefQ(A.map((r, i) => r.concat([b[i]])), n);
  if (inconsistent || pivots.length < n) return null;
  return M.map((r) => r[n]);
}
function* combinations_(m, k) {
  const idx = Array.from({ length: k }, (_, i) => i);
  if (k > m) return;
  for (;;) {
    yield idx.slice();
    let i = k - 1;
    while (i >= 0 && idx[i] === m - k + i) i--;
    if (i < 0) return;
    idx[i]++;
    for (let j = i + 1; j < k; j++) idx[j] = idx[j - 1] + 1;
  }
}
function tryLinearProgram(text) {
  const m0 = LP_START.exec(text);
  if (!m0) return null;
  const goal = /^max/.test(m0[1]) ? 1 : -1;
  const parts = splitObjective(m0[2]);
  if (!parts) return null;
  let objText = parts[0].trim();
  const integerOnly = /\binteger|\bwhole\s+numbers?/.test(text);
  const nonNeg = /non-?\s?negative/.test(text);
  // clauses such as "x and y are integers" are not constraints
  const consClean = parts[1]
    .replace(/(?:[,;]\s*|\band\s+)?(?:\u0002?[a-z]\s*(?:,|\band\b)\s*)*\u0002?[a-z]\s+(?:are|is)\s+(?:all\s+)?(?:non-?\s?negative\s+)?(?:integers?|whole\s+numbers?)\b/g, ' ')
    .replace(/[^;,\n]*\b(?:integers?|whole\s+numbers?|non-?\s?negative)\b[^;,\n]*/g, ' ');
  const consText = lpConstraintTexts(consClean);
  if (!consText.length && !nonNeg) return null;
  // "z = 3x + 2y" -> the expression on the right
  const eqAt = topLevelRelations(objText).find((o) => o.op === '=');
  if (eqAt) objText = objText.slice(eqAt.i + 1);
  objText = cleanStatement(objText);
  let objNode;
  try {
    objNode = parseExpression(objText);
  } catch (e) {
    return null;
  }
  const sts = consText.map((t) => parseStatement(cleanStatement(t)));
  if (sts.some((s) => s.kind === 'expr')) throw new MathError('each constraint needs a relation such as x + y <= 4');
  const vars = new Set();
  collectVars(objNode, vars);
  const conds = [];
  sts.forEach((st) => {
    if (st.kind === 'eq') conds.push({ lhs: st.lhs, op: '=', rhs: st.rhs });
    else st.conds.forEach((c) => conds.push(c));
  });
  conds.forEach((c) => {
    collectVars(c.lhs, vars);
    collectVars(c.rhs, vars);
  });
  const names = sortedVars(vars);
  if (nonNeg) names.forEach((nm) => conds.push({ lhs: { t: 'var', name: nm }, op: '>=', rhs: { t: 'num', q: Q0, f: 0, text: '0' } }));
  if (names.length < 1 || names.length > 4) throw new MathError('linear programs with 1 to 4 variables are supported');
  if (conds.length > 16) throw new MathError('at most 16 constraints are supported');
  const form = (lhs, rhs) => affineForm({ lhs, rhs }, names);
  const obj = form(objNode, { t: 'num', q: Q0, f: 0, text: '0' });
  if (!obj) throw new MathError('the objective must be linear in the variables');
  // constraints as  a\u00b7x <= b
  const rows = [];
  const shown = [];
  conds.forEach((c) => {
    const f = form(c.lhs, c.rhs);
    if (!f) throw new MathError('every constraint must be linear: ' + showRaw(c.lhs) + ' ' + c.op + ' ' + showRaw(c.rhs));
    const a = f.coef;
    const b = f.c0.neg();
    const flip = c.op === '>=' || c.op === '>';
    const norm = flip ? a.map((v) => v.neg()) : a;
    const nb = flip ? b.neg() : b;
    rows.push({ a: norm, b: nb });
    if (c.op === '=') rows.push({ a: a.map((v) => v.neg()), b: b.neg() });
    shown.push(showRaw(c.lhs) + ' ' + LP_SHOW[c.op] + ' ' + showRaw(c.rhs));
  });
  const n = names.length;
  const box = [];
  names.forEach((_, j) => {
    const up = names.map((__, k) => (k === j ? Q1 : Q0));
    box.push({ a: up, b: LP_BIG, box: true });
    box.push({ a: up.map((v) => v.neg()), b: LP_BIG, box: true });
  });
  const all = rows.concat(box);
  const feasible = (x) => all.every((r) => r.a.reduce((s, c, j) => s.add(c.mul(x[j])), Q0).sub(r.b).sign() <= 0);
  const verts = [];
  const seen = new Set();
  for (const idx of combinations_(all.length, n)) {
    const x = solveSquare(idx.map((i) => all[i].a), idx.map((i) => all[i].b));
    if (!x || !feasible(x)) continue;
    const key0 = x.map((q) => q.toString()).join('|');
    if (seen.has(key0)) continue;
    seen.add(key0);
    verts.push(x);
  }
  const out = newOut();
  const readAs = (goal > 0 ? 'maximize ' : 'minimize ') + showRaw(objNode) + ' subject to ' + shown.join(';  ');
  const objVal = (x) => obj.coef.reduce((s, c, j) => s.add(c.mul(x[j])), obj.c0);
  const pointText = (x) => '(' + names.map((nm, j) => nm + ' = ' + qText(x[j])).join(', ') + ')';
  if (!verts.length) {
    out.answer.push('no feasible solution: the constraints contradict each other');
    return { readAs, out };
  }
  const onBox = (x) => x.some((q) => q.abs().sub(LP_BIG).sign() >= 0);
  const real = verts.filter((x) => !onBox(x));
  let best = null;
  verts.forEach((x) => {
    const v = objVal(x).mul(qInt(goal));
    if (best === null || v.sub(best).sign() > 0) best = v;
  });
  const optimal = verts.filter((x) => objVal(x).mul(qInt(goal)).eq(best));
  if (optimal.every(onBox)) {
    out.answer.push('unbounded: the objective can be made arbitrarily ' + (goal > 0 ? 'large' : 'small') + ' inside the feasible region');
    return { readAs, out };
  }
  const optimalReal = optimal.filter((x) => !onBox(x));
  if (integerOnly) {
    if (real.length !== verts.length) throw new MathError('integer programming needs a bounded feasible region');
    const lo = names.map((_, j) => floorQ(real.reduce((m, x) => (x[j].sub(m).sign() < 0 ? x[j] : m), real[0][j])));
    const hi = names.map((_, j) => real.reduce((m, x) => (x[j].sub(m).sign() > 0 ? x[j] : m), real[0][j]));
    const spans = names.map((_, j) => Number(floorQ(hi[j]).n - lo[j].n) + 1);
    if (spans.reduce((a, b) => a * b, 1) > 2000000) throw new MathError('the integer search region is too large');
    let bestI = null;
    let bestPts = [];
    const cur = [];
    const rec = (j) => {
      if (j === n) {
        const x = cur.map((v) => qInt(v));
        if (!feasible(x)) return;
        const v = objVal(x).mul(qInt(goal));
        if (bestI === null || v.sub(bestI).sign() > 0) {
          bestI = v;
          bestPts = [x];
        } else if (v.eq(bestI)) bestPts.push(x);
        return;
      }
      for (let v = Number(lo[j].n); v <= Number(floorQ(hi[j]).n); v++) {
        cur[j] = v;
        rec(j + 1);
      }
    };
    rec(0);
    if (!bestPts.length) {
      out.answer.push('no integer point satisfies all the constraints');
      return { readAs, out };
    }
    out.answer.push((goal > 0 ? 'maximum' : 'minimum') + ' value ' + qText(objVal(bestPts[0])) + ' (integer solution) at ' + bestPts.slice(0, 4).map(pointText).join(' or '));
    out.work.push('Without the integer requirement the optimum is ' + qText(objVal(optimalReal[0])) + ' at ' + pointText(optimalReal[0]) + '; the best whole-number point of the region was found by checking every one');
    return { readAs, out };
  }
  out.answer.push((goal > 0 ? 'maximum' : 'minimum') + ' value = ' + qText(objVal(optimalReal[0])) + ' at ' + optimalReal.slice(0, 4).map(pointText).join(' and ') + (optimal.length > 1 ? '  (optimal along a whole edge: every point between these corners' + (optimal.some(onBox) ? ', and along the unbounded edge,' : '') + ' gives the same value)' : ''));
  // vertices listed in order around the region for two variables
  let listed = real;
  if (n === 2 && real.length > 2) {
    const cx = real.reduce((s, x) => s + x[0].toNumber(), 0) / real.length;
    const cy = real.reduce((s, x) => s + x[1].toNumber(), 0) / real.length;
    listed = real.slice().sort((p, q) => Math.atan2(p[1].toNumber() - cy, p[0].toNumber() - cx) - Math.atan2(q[1].toNumber() - cy, q[0].toNumber() - cx));
  }
  if (real.length !== verts.length) out.notes.push('The feasible region is unbounded, but the objective is bounded in this direction.');
  out.work.push('Corner points of the feasible region (objective value in brackets): ' + listed.map((x) => pointText(x) + ' [' + qText(objVal(x)) + ']').join(';  '));
  out.work.push('The optimum of a linear objective lies at a corner point; all corner points were found exactly by solving every pair/triple of constraint boundaries and keeping the feasible ones.');
  return { readAs, out };
}

// ======================================================================
// 90. Routing of command statements (integrate(...), det(...), matrices, ODEs ...)
//     A command handler returns an `out` object; when it yields one value it also sets
//     out.value = {S} | {q} | {num}, so commands can be used inside other expressions.
// ======================================================================

/** How the statement is shown in the "Read as" line. */
function readAsNode(n) {
  const c = n.t === 'call' && n.cmd && COMMANDS[n.fn];
  if (c && c.show) {
    try {
      return c.show(n);
    } catch (e) {
      return showRaw(n); // wrong arguments: the command itself reports the problem
    }
  }
  return showRaw(n);
}

function statementHas(st, types) {
  if (st.kind === 'expr') return hasNode(st.node, types);
  if (st.kind === 'eq') return hasNode(st.lhs, types) || hasNode(st.rhs, types);
  return st.nodes.some((x) => hasNode(x, types));
}

function runCommandCall(n) {
  const c = COMMANDS[n.fn];
  if (!c) throw new MathError('unknown command ' + n.fn);
  try {
    return c(n);
  } catch (e) {
    if (e instanceof NotAlgebraic) throw new MathError(n.fn + ': this kind of expression is not supported here (type help for what ' + n.fn + ' accepts)');
    throw e;
  }
}

/** A command used inside an expression: its single value as a symbolic expression. */
function commandValueS(n) {
  const out = runCommandCall(n);
  const v = out.value;
  if (!v) throw new MathError('"' + n.fn + '" gives more than one value, so it cannot be used inside an expression');
  if (v.S) return v.S;
  if (v.q) return sN(v.q);
  if (typeof v.num === 'number' && isFinite(v.num)) return sN(qFromLiteral(String(v.num).replace(/^-/, '')).mul(v.num < 0 ? qInt(-1) : Q1));
  throw new MathError('"' + n.fn + '" gives no usable value here');
}

function evalCommandNode(n) {
  if (n.t === 'call' && n.cmd) return runCommandCall(n);
  return matrixExpression(n);
}

/** Replace command calls inside an expression by their values (so equations can contain them). */
function resolveNode(n) {
  switch (n.t) {
    case 'call':
      if (n.cmd) return sAst(commandValueS(n));
      return { ...n, args: n.args.map(resolveNode) };
    case 'neg': case 'fact': case 'pct': return { ...n, a: resolveNode(n.a) };
    case 'bin': return { ...n, a: resolveNode(n.a), b: resolveNode(n.b) };
    default: return n;
  }
}
function resolveCommandsStatement(st) {
  if (st.kind === 'eq' && (hasCommand(st.lhs) || hasCommand(st.rhs))) return { ...st, lhs: resolveNode(st.lhs), rhs: resolveNode(st.rhs) };
  if (st.kind === 'rel' && st.nodes.some(hasCommand)) {
    const nodes = st.nodes.map(resolveNode);
    return { ...st, nodes, conds: st.conds.map((c, k) => ({ ...c, lhs: nodes[k], rhs: nodes[k + 1] })) };
  }
  return st;
}

/** Returns {readAs, out} for statements that are commands / matrix expressions / ODEs, else null. */
function trySpecial(sts, solveFor) {
  if (sts.some((s) => statementHas(s, ['dvar']))) return solveODEStatements(sts);
  if (sts.every((s) => s.kind === 'expr') && sts.some((s) => hasCommand(s.node) || hasNode(s.node, ['list']))) {
    if (sts.length === 1) return { readAs: readAsNode(sts[0].node), out: evalCommandNode(sts[0].node) };
    const out = newOut();
    sts.forEach((st) => {
      const o = evalCommandNode(st.node);
      out.answer.push(readAsNode(st.node) + '  ->  ' + o.answer.join(';  '));
    });
    return { readAs: sts.map((s) => readAsNode(s.node)).join(';  '), out };
  }
  return null;
}

// ======================================================================
// 6. Entry point used by AI Edge Gallery:  ai_edge_gallery_get_result(data)
// ======================================================================
const MAX_PROBLEMS = 8;

/** Accepts {"equation": "..."}, {"problems": [...]}, a bare JSON string, or plain text. */
function parseRequest(data) {
  const raw = data === undefined || data === null ? '' : String(data).trim();
  if (!raw) throw new MathError('no equation was given (the "equation" field is empty)');
  let obj;
  try {
    obj = JSON.parse(raw);
  } catch (e) {
    obj = raw;
  }
  const problems = [];
  let solveFor = '';
  const asText = (x) => (x && typeof x === 'object' ? String(x.equation || x.problem || x.text || '') : String(x === undefined || x === null ? '' : x));
  if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
    solveFor = String(obj.solve_for || obj.solveFor || obj.variable || obj.unknown || '').trim();
    if (Array.isArray(obj.problems)) obj.problems.forEach((p) => problems.push(asText(p)));
    else if (Array.isArray(obj.equations)) problems.push(obj.equations.map(asText).join(';'));
    else {
      const keys = ['equation', 'problem', 'expression', 'math', 'text', 'question', 'input', 'equations', 'expressions'];
      const k = keys.find((key) => obj[key] !== undefined && obj[key] !== null && obj[key] !== '');
      if (k) problems.push(asText(obj[k]));
    }
  } else if (Array.isArray(obj)) {
    obj.forEach((p) => problems.push(asText(p)));
  } else {
    problems.push(asText(obj));
  }
  const list = problems.map((p) => p.trim()).filter(Boolean);
  if (!list.length) throw new MathError('no equation was given (the "equation" field is empty)');
  if (list.length > MAX_PROBLEMS) throw new MathError('too many problems at once (maximum ' + MAX_PROBLEMS + ')');
  return { problems: list, solveFor };
}

function explain(e) {
  if (e instanceof MathError) return unmarkLetters(e.message);
  if (e instanceof RangeError) return 'the numbers or expression are too large to handle';
  return 'unexpected failure (' + (e && e.message ? e.message : e) + ')';
}

function run(data) {
  const { problems, solveFor } = parseRequest(data);
  if (problems.length === 1) {
    const help = helpFor(problems[0]);
    if (help) return { text: help, image: null };
    const { readAs, out } = solveProblem(problems[0], solveFor);
    return { text: renderResult(readAs, out), image: out.image || null };
  }
  let image = null;
  const text = problems.map((p, i) => {
    try {
      const { readAs, out } = solveProblem(p, solveFor);
      if (out.image && !image) image = out.image;
      return 'Problem ' + (i + 1) + '\n' + renderResult(readAs, out);
    } catch (e) {
      return 'Problem ' + (i + 1) + '\nRead as: ' + p + '\nError: ' + explain(e);
    }
  }).join('\n\n');
  return { text, image };
}

const RETRY_HINT = ' Re-read the picture and call the tool again with the math written in plain text (digits, letters, + - * / ^ ( ), sqrt(), pi, =, <, >).';

window['ai_edge_gallery_get_result'] = async (data) => {
  try {
    const r = run(data);
    return JSON.stringify(r.image ? { result: r.text, image: { base64: r.image } } : { result: r.text });
  } catch (e) {
    if (!(e instanceof MathError)) console.error(e);
    return JSON.stringify({ error: 'Could not solve: ' + explain(e) + '.' + RETRY_HINT });
  }
};
})();
